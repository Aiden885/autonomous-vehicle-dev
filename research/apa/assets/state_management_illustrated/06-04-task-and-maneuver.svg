<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="646" viewBox="0 0 1080 646" role="img" aria-labelledby="title desc"><title id="title">同一项泊车任务，内部可以停车并换向</title><desc id="desc">图6-1中 APA_Ctrl 范围的跨层配合示意；非主状态转移图，非实测时序。</desc><rect x="0" y="0" width="1080" height="646" rx="0" fill="white" stroke="none" stroke-width="1.5" /><text x="32" y="44" font-family="Noto Sans CJK SC" font-size="29" fill="#183047" text-anchor="start" font-weight="700">同一项泊车任务，内部可以停车并换向</text><text x="32" y="78" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">图6-1中 APA_Ctrl 范围的跨层配合示意；非主状态转移图，非实测时序。</text><text x="305" y="147" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="middle" font-weight="700">倒车行驶</text><polyline points="380,176 425,176" fill="none" stroke="#78909F" stroke-width="2" /><polygon points="425,176 415.0,172.0 415.0,180.0" fill="#78909F" /><text x="510" y="147" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="middle" font-weight="700">制动停下</text><polyline points="585,176 630,176" fill="none" stroke="#78909F" stroke-width="2" /><polygon points="630,176 620.0,172.0 620.0,180.0" fill="#78909F" /><text x="715" y="147" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="middle" font-weight="700">换向准备</text><polyline points="790,176 835,176" fill="none" stroke="#78909F" stroke-width="2" /><polygon points="835,176 825.0,172.0 825.0,180.0" fill="#78909F" /><text x="920" y="147" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="middle" font-weight="700">前进行驶</text><text x="30" y="253" font-family="Noto Sans CJK SC" font-size="23" fill="#183047" text-anchor="start" font-weight="700">任务层</text><rect x="210" y="207" width="800" height="90" rx="9" fill="#EAF3F7" stroke="#14678A" stroke-width="1.5" /><text x="610" y="242" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="middle" font-weight="700">APA_Ctrl：仍属于自动泊车任务的执行管理</text><text x="610" y="275" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="middle">此示例没有触发任务退出；具体子状态仍按反馈变化</text><text x="30" y="362" font-family="Noto Sans CJK SC" font-size="23" fill="#183047" text-anchor="start" font-weight="700">MoCo 职责</text><rect x="210" y="321" width="185" height="85" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="302" y="353" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle">跟踪当前</text><text x="302" y="382" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle">倒车段</text><rect x="415" y="321" width="185" height="85" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="507" y="353" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle">制动与</text><text x="507" y="382" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle">停稳处理</text><rect x="620" y="321" width="185" height="85" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="712" y="353" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle">挡位 / 转向</text><text x="712" y="382" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle">准备处理</text><rect x="825" y="321" width="185" height="85" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="917" y="353" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle">跟踪下一</text><text x="917" y="382" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle">前进段</text><text x="30" y="466" font-family="Noto Sans CJK SC" font-size="23" fill="#183047" text-anchor="start" font-weight="700">车辆运动</text><rect x="210" y="432" width="185" height="70" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="302" y="476" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle">向后运动</text><rect x="415" y="432" width="185" height="70" rx="9" fill="#FAF0DE" stroke="#78909F" stroke-width="1.5" /><text x="507" y="476" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle">减速至停止</text><rect x="620" y="432" width="185" height="70" rx="9" fill="#FAF0DE" stroke="#78909F" stroke-width="1.5" /><text x="712" y="476" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle">保持停止</text><rect x="825" y="432" width="185" height="70" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="917" y="476" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle">向前运动</text><text x="32" y="563" font-family="Noto Sans CJK SC" font-size="23" fill="#183047" text-anchor="start" font-weight="700">停车只是当前机动的一部分，不自动表示任务结束。</text><text x="32" y="600" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">图中不规定全部支路的换挡与打盘顺序；运动能否继续取决于实际准备和保护条件。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="990" viewBox="0 0 1080 990" role="img" aria-labelledby="title desc"><title id="title">状态层级：外层管理功能，内层管理任务</title><desc id="desc">框内包含关系来自原模型；本图不表示执行先后，也不画转换箭头。</desc><rect x="0" y="0" width="1080" height="990" rx="0" fill="white" stroke="none" stroke-width="1.5" /><text x="32" y="44" font-family="Noto Sans CJK SC" font-size="29" fill="#183047" text-anchor="start" font-weight="700">状态层级：外层管理功能，内层管理任务</text><text x="32" y="78" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">框内包含关系来自原模型；本图不表示执行先后，也不画转换箭头。</text><rect x="60" y="113" width="300" height="70" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="210.0" y="141" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">功能关闭</text><text x="210.0" y="165" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">Off</text><rect x="390" y="113" width="300" height="70" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="540.0" y="141" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">异常关闭</text><text x="540.0" y="165" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">FailOff</text><rect x="720" y="113" width="300" height="70" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="870.0" y="141" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">异常保持</text><text x="870.0" y="165" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">KeepIPM</text><rect x="40" y="211" width="1000" height="691" rx="9" fill="#EAF3F7" stroke="#14678A" stroke-width="1.5" /><text x="60" y="246" font-family="Noto Sans CJK SC" font-size="23" fill="#183047" text-anchor="start" font-weight="700">Act：功能激活范围，不等同于正在移动车辆</text><rect x="60" y="272" width="225" height="70" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="172.5" y="300" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">待命</text><text x="172.5" y="324" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">Standby_Inner</text><rect x="305" y="272" width="225" height="70" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="417.5" y="300" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">启动准备</text><text x="417.5" y="324" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">RTA</text><rect x="550" y="272" width="225" height="70" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="662.5" y="300" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">驾驶员搜位</text><text x="662.5" y="324" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">Driver_Search</text><rect x="795" y="272" width="225" height="70" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="907.5" y="300" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">泊出准备</text><text x="907.5" y="324" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">Wait2PrkOut</text><rect x="60" y="374" width="960" height="380" rx="9" fill="white" stroke="#14678A" stroke-width="1.5" /><text x="80" y="410" font-family="Noto Sans CJK SC" font-size="23" fill="#183047" text-anchor="start" font-weight="700">APA_Ctrl：自动泊车任务的执行管理范围</text><rect x="80" y="439" width="215" height="72" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="187.5" y="467" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">执行前准备</text><text x="187.5" y="491" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">StpTAct</text><rect x="315" y="439" width="215" height="72" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="422.5" y="467" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">等待底盘</text><text x="422.5" y="491" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">ChassisWait</text><rect x="550" y="439" width="215" height="72" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="657.5" y="467" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">执行中</text><text x="657.5" y="491" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">Processing</text><rect x="785" y="439" width="215" height="72" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="892.5" y="467" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">任务完成</text><text x="892.5" y="491" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">Finish</text><rect x="80" y="536" width="215" height="72" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="187.5" y="564" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">路径等待</text><text x="187.5" y="588" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">WaitOnPath</text><rect x="315" y="536" width="215" height="72" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="422.5" y="564" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">重规划</text><text x="422.5" y="588" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">RePlan</text><rect x="550" y="536" width="215" height="72" rx="9" fill="#FAF0DE" stroke="#78909F" stroke-width="1.5" /><text x="657.5" y="564" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">暂停</text><text x="657.5" y="588" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">Pause</text><rect x="785" y="536" width="215" height="72" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="892.5" y="564" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">制动介入等待</text><text x="892.5" y="588" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">HangOn</text><rect x="80" y="633" width="215" height="72" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="187.5" y="661" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">地锁等条件等待</text><text x="187.5" y="685" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">GrdLckWait</text><rect x="315" y="633" width="215" height="72" rx="9" fill="#FAF0DE" stroke="#78909F" stroke-width="1.5" /><text x="422.5" y="661" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">紧急保护</text><text x="422.5" y="685" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">EmergencyBrk</text><rect x="550" y="633" width="215" height="72" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="657.5" y="661" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">结束挡位等待</text><text x="657.5" y="685" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">WaitGear</text><rect x="60" y="794" width="310" height="70" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="215.0" y="822" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">接管或取消退出</text><text x="215.0" y="846" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">OverRide</text><rect x="385" y="794" width="310" height="70" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="540.0" y="822" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">任务失败</text><text x="540.0" y="846" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">FAIL</text><rect x="710" y="794" width="310" height="70" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="865.0" y="822" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">界面等保持</text><text x="865.0" y="846" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">KeepIVI</text><text x="40" y="943" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start" font-weight="700">当前位于 Processing 时，同时位于其父层 APA_Ctrl 和 Act。</text><text x="40" y="974" font-family="Noto Sans CJK SC" font-size="17" fill="#526577" text-anchor="start">同层运行状态互斥；图形函数、注释分组与 junction 不作为运行状态列入。</text></svg>
<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="1210" viewBox="0 0 1030 1210" role="img" aria-labelledby="title desc"><title id="title">正常泊入主线：先准备，再执行，最后确认结束</title><desc id="desc">仅选取一条正常通路；箭头文字概括主要条件，不代替全部守卫和优先顺序。</desc><rect x="0" y="0" width="1030" height="1210" rx="0" fill="white" stroke="none" stroke-width="1.5" /><text x="32" y="44" font-family="Noto Sans CJK SC" font-size="29" fill="#183047" text-anchor="start" font-weight="700">正常泊入主线：先准备，再执行，最后确认结束</text><text x="32" y="78" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">仅选取一条正常通路；箭头文字概括主要条件，不代替全部守卫和优先顺序。</text><rect x="60" y="107" width="354" height="68" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="237.0" y="135" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">功能关闭</text><text x="237.0" y="159" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">Off</text><rect x="60" y="224" width="354" height="68" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="237.0" y="252" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">待命</text><text x="237.0" y="276" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">Standby_Inner</text><rect x="60" y="341" width="354" height="68" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="237.0" y="369" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">启动准备</text><text x="237.0" y="393" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">RTA</text><rect x="60" y="458" width="354" height="68" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="237.0" y="486" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">驾驶员搜位</text><text x="237.0" y="510" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">Driver_Search</text><rect x="60" y="575" width="354" height="68" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="237.0" y="603" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">执行前准备</text><text x="237.0" y="627" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">StpTAct</text><rect x="60" y="692" width="354" height="68" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="237.0" y="720" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">等待底盘</text><text x="237.0" y="744" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">ChassisWait</text><rect x="60" y="809" width="354" height="68" rx="9" fill="#FAF0DE" stroke="#78909F" stroke-width="1.5" /><text x="237.0" y="837" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">执行中</text><text x="237.0" y="861" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">Processing</text><rect x="60" y="926" width="354" height="68" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="237.0" y="954" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">结束挡位等待</text><text x="237.0" y="978" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">WaitGear</text><rect x="60" y="1043" width="354" height="68" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="237.0" y="1071" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">任务完成</text><text x="237.0" y="1095" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">Finish</text><polyline points="237,175 237,224" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="237,224 241.0,214.0 233.0,214.0" fill="#14678A" /><text x="448" y="191" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start">功能启用条件满足</text><text x="448" y="218" font-family="Noto Sans CJK SC" font-size="17" fill="#526577" text-anchor="start">经 Act 的默认入口进入待命</text><polyline points="237,292 237,341" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="237,341 241.0,331.0 233.0,331.0" fill="#14678A" /><text x="448" y="308" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start">收到 APA 启动请求</text><text x="448" y="335" font-family="Noto Sans CJK SC" font-size="17" fill="#526577" text-anchor="start">待命不等于自动行驶</text><polyline points="237,409 237,458" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="237,458 241.0,448.0 233.0,448.0" fill="#14678A" /><text x="448" y="425" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start">关联系统与新信息满足条件</text><text x="448" y="452" font-family="Noto Sans CJK SC" font-size="17" fill="#526577" text-anchor="start">含对应感知及更新条件</text><polyline points="237,526 237,575" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="237,575 241.0,565.0 233.0,565.0" fill="#14678A" /><text x="448" y="542" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start">目标、低速、制动等条件满足</text><text x="448" y="569" font-family="Noto Sans CJK SC" font-size="17" fill="#526577" text-anchor="start">进入 APA_Ctrl 后取默认子状态</text><polyline points="237,643 237,692" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="237,692 241.0,682.0 233.0,682.0" fill="#14678A" /><text x="448" y="659" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start">执行前确认条件满足</text><text x="448" y="686" font-family="Noto Sans CJK SC" font-size="17" fill="#526577" text-anchor="start">结合车辆、路径和底盘相关条件</text><polyline points="237,760 237,809" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="237,809 241.0,799.0 233.0,799.0" fill="#14678A" /><text x="448" y="776" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start">底盘与 MoCo 准备条件满足</text><text x="448" y="803" font-family="Noto Sans CJK SC" font-size="17" fill="#526577" text-anchor="start">同时检查制动踏板条件</text><polyline points="237,877 237,926" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="237,926 241.0,916.0 233.0,916.0" fill="#14678A" /><text x="448" y="893" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start">MoCo 完成反馈，且速度符合条件</text><text x="448" y="920" font-family="Noto Sans CJK SC" font-size="17" fill="#526577" text-anchor="start">还未完成全部收尾确认</text><polyline points="237,994 237,1043" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="237,1043 241.0,1033.0 233.0,1033.0" fill="#14678A" /><text x="448" y="1010" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start">结束挡位与底盘状态确认</text><text x="448" y="1037" font-family="Noto Sans CJK SC" font-size="17" fill="#526577" text-anchor="start">进入任务完成阶段</text><text x="40" y="1174" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">其他转移可令流程暂停、改道或退出；此图不代表每次泊车必经且只经这些状态。</text></svg>
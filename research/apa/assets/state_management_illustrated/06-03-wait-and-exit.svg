<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1120" viewBox="0 0 1080 1120" role="img" aria-labelledby="title desc"><title id="title">停下来之后，等待的条件并不相同</title><desc id="desc">四组小图分别抽取实际转移；不是完整状态机，也不表示这些通路具有最高优先级。</desc><rect x="0" y="0" width="1080" height="1120" rx="0" fill="white" stroke="none" stroke-width="1.5" /><text x="32" y="44" font-family="Noto Sans CJK SC" font-size="29" fill="#183047" text-anchor="start" font-weight="700">停下来之后，等待的条件并不相同</text><text x="32" y="78" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">四组小图分别抽取实际转移；不是完整状态机，也不表示这些通路具有最高优先级。</text><rect x="40" y="132" width="250" height="76" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="165.0" y="160" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">执行中</text><text x="165.0" y="184" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">Processing</text><rect x="760" y="132" width="280" height="76" rx="9" fill="#FAF0DE" stroke="#78909F" stroke-width="1.5" /><text x="900.0" y="160" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">暂停</text><text x="900.0" y="184" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">Pause</text><polyline points="290,155 760,155" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="760,155 750.0,151.0 750.0,159.0" fill="#14678A" /><text x="525" y="142" font-family="Noto Sans CJK SC" font-size="19" fill="#183047" text-anchor="middle">底盘条件及暂停/车辆条件成立</text><polyline points="760,193 290,193" fill="none" stroke="#526577" stroke-width="2" /><polygon points="290,193 300.0,197.0 300.0,189.0" fill="#526577" /><text x="525" y="230" font-family="Noto Sans CJK SC" font-size="19" fill="#183047" text-anchor="middle">新恢复确认＋相关车辆条件恢复</text><rect x="40" y="330" width="250" height="76" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="165.0" y="358" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">执行中</text><text x="165.0" y="382" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">Processing</text><rect x="760" y="330" width="280" height="76" rx="9" fill="#FAF0DE" stroke="#78909F" stroke-width="1.5" /><text x="900.0" y="358" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">路径等待</text><text x="900.0" y="382" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">WaitOnPath</text><polyline points="290,353 760,353" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="760,353 750.0,349.0 750.0,357.0" fill="#14678A" /><text x="525" y="340" font-family="Noto Sans CJK SC" font-size="19" fill="#183047" text-anchor="middle">路径侧提出停车要求等条件成立</text><polyline points="760,391 290,391" fill="none" stroke="#526577" stroke-width="2" /><polygon points="290,391 300.0,395.0 300.0,387.0" fill="#526577" /><text x="525" y="428" font-family="Noto Sans CJK SC" font-size="19" fill="#183047" text-anchor="middle">路径停车要求解除</text><rect x="40" y="528" width="250" height="76" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="165.0" y="556" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">执行中</text><text x="165.0" y="580" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">Processing</text><rect x="760" y="528" width="280" height="76" rx="9" fill="#FAF0DE" stroke="#78909F" stroke-width="1.5" /><text x="900.0" y="556" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">重规划</text><text x="900.0" y="580" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">RePlan</text><polyline points="290,551 760,551" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="760,551 750.0,547.0 750.0,555.0" fill="#14678A" /><text x="525" y="538" font-family="Noto Sans CJK SC" font-size="19" fill="#183047" text-anchor="middle">后处理的重规划状态及计数满足条件</text><polyline points="760,589 290,589" fill="none" stroke="#526577" stroke-width="2" /><polygon points="290,589 300.0,593.0 300.0,585.0" fill="#526577" /><text x="525" y="626" font-family="Noto Sans CJK SC" font-size="19" fill="#183047" text-anchor="middle">规划/控制进展满足＋相关风险解除</text><rect x="40" y="726" width="250" height="76" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="165.0" y="754" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">执行中</text><text x="165.0" y="778" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">Processing</text><rect x="760" y="726" width="280" height="76" rx="9" fill="#FAF0DE" stroke="#78909F" stroke-width="1.5" /><text x="900.0" y="754" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">紧急保护</text><text x="900.0" y="778" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">EmergencyBrk</text><polyline points="290,749 760,749" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="760,749 750.0,745.0 750.0,753.0" fill="#14678A" /><text x="525" y="736" font-family="Noto Sans CJK SC" font-size="19" fill="#183047" text-anchor="middle">碰撞风险或相关保护请求成立</text><polyline points="760,787 290,787" fill="none" stroke="#526577" stroke-width="2" /><polygon points="290,787 300.0,791.0 300.0,783.0" fill="#526577" /><text x="525" y="824" font-family="Noto Sans CJK SC" font-size="19" fill="#183047" text-anchor="middle">风险/停车要求解除＋执行条件允许</text><rect x="32" y="946" width="1016" height="104" rx="9" fill="#EAF3F7" stroke="#78909F" stroke-width="1.5" /><rect x="50" y="960" width="280" height="70" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="190.0" y="988" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">整个执行管理范围</text><text x="190.0" y="1012" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">APA_Ctrl</text><rect x="760" y="960" width="270" height="70" rx="9" fill="#FAF0DE" stroke="#78909F" stroke-width="1.5" /><text x="895.0" y="988" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">接管或取消退出</text><text x="895.0" y="1012" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">OverRide</text><polyline points="330,995 760,995" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="760,995 750.0,991.0 750.0,999.0" fill="#14678A" /><text x="545" y="981" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="middle">父层接管 / 取消条件成立</text><text x="40" y="1090" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">父层退出不是普通暂停恢复；紧急保护还有转入重规划等其他支路，图中省略。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="718" viewBox="0 0 1120 718" role="img" aria-labelledby="title desc"><title id="title">UnitDelay 的作用：把电平变成可识别的新事件</title><desc id="desc">布尔教学例，上一周期记忆的初值设为 0；不是实际按键日志，也不规定某个端口的初值。</desc><rect x="0" y="0" width="1120" height="718" rx="0" fill="white" stroke="none" stroke-width="1.5" /><text x="32" y="44" font-family="Noto Sans CJK SC" font-size="29" fill="#183047" text-anchor="start" font-weight="700">UnitDelay 的作用：把电平变成可识别的新事件</text><text x="32" y="78" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">布尔教学例，上一周期记忆的初值设为 0；不是实际按键日志，也不规定某个端口的初值。</text><polyline points="280,133 280,565" fill="none" stroke="#D8E0E5" stroke-width="2" /><polyline points="400,133 400,565" fill="none" stroke="#D8E0E5" stroke-width="2" /><polyline points="520,133 520,565" fill="none" stroke="#D8E0E5" stroke-width="2" /><polyline points="640,133 640,565" fill="none" stroke="#D8E0E5" stroke-width="2" /><polyline points="760,133 760,565" fill="none" stroke="#D8E0E5" stroke-width="2" /><polyline points="880,133 880,565" fill="none" stroke="#D8E0E5" stroke-width="2" /><polyline points="1000,133 1000,565" fill="none" stroke="#D8E0E5" stroke-width="2" /><text x="32" y="208" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="start" font-weight="700">当前输入 u(k)</text><text x="243" y="240" font-family="Noto Sans CJK SC" font-size="16" fill="#183047" text-anchor="start">0</text><text x="243" y="183" font-family="Noto Sans CJK SC" font-size="16" fill="#183047" text-anchor="start">1</text><polyline points="280,235 400,235 400,235 400,177 520,177 520,177 520,177 640,177 640,177 640,235 760,235 760,235 760,177 880,177 880,177 880,177 1000,177" fill="none" stroke="#14678A" stroke-width="3" /><text x="32" y="353" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="start" font-weight="700">记忆 u(k−1)</text><text x="243" y="385" font-family="Noto Sans CJK SC" font-size="16" fill="#183047" text-anchor="start">0</text><text x="243" y="328" font-family="Noto Sans CJK SC" font-size="16" fill="#183047" text-anchor="start">1</text><polyline points="280,380 400,380 400,380 400,380 520,380 520,380 520,322 640,322 640,322 640,322 760,322 760,322 760,380 880,380 880,380 880,322 1000,322" fill="none" stroke="#526577" stroke-width="3" /><text x="32" y="498" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="start" font-weight="700">上升沿事件</text><text x="243" y="530" font-family="Noto Sans CJK SC" font-size="16" fill="#183047" text-anchor="start">0</text><text x="243" y="473" font-family="Noto Sans CJK SC" font-size="16" fill="#183047" text-anchor="start">1</text><polyline points="280,525 400,525 400,525 400,467 520,467 520,467 520,525 640,525 640,525 640,525 760,525 760,525 760,467 880,467 880,467 880,525 1000,525" fill="none" stroke="#14678A" stroke-width="3" /><text x="340.0" y="590" font-family="Noto Sans CJK SC" font-size="18" fill="#183047" text-anchor="middle">k=0</text><text x="460.0" y="590" font-family="Noto Sans CJK SC" font-size="18" fill="#183047" text-anchor="middle">k=1</text><text x="580.0" y="590" font-family="Noto Sans CJK SC" font-size="18" fill="#183047" text-anchor="middle">k=2</text><text x="700.0" y="590" font-family="Noto Sans CJK SC" font-size="18" fill="#183047" text-anchor="middle">k=3</text><text x="820.0" y="590" font-family="Noto Sans CJK SC" font-size="18" fill="#183047" text-anchor="middle">k=4</text><text x="940.0" y="590" font-family="Noto Sans CJK SC" font-size="18" fill="#183047" text-anchor="middle">k=5</text><text x="32" y="640" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="start">u(k) AND NOT u(k−1)：只在新上升时成立，持续按下不会每周期都当成一次新操作。</text><text x="32" y="687" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">这解释图6-3恢复确认需要历史值的原因；Delay 存储的是值，不会自动完成整项任务仲裁。</text></svg>
<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="765" viewBox="0 0 1120 765" role="img" aria-labelledby="title desc"><title id="title">跨帧跟踪：车动了，不等于车位动了</title><desc id="desc">沿用图3-1的参考系思想；本例仅沿 x 平移，方向不变，数值用于说明原理。</desc><rect x="0" y="0" width="1120" height="765" rx="0" fill="white" stroke="none" stroke-width="1.5" /><text x="32" y="44" font-family="Noto Sans CJK SC" font-size="29" fill="#183047" text-anchor="start" font-weight="700">跨帧跟踪：车动了，不等于车位动了</text><text x="32" y="78" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">沿用图3-1的参考系思想；本例仅沿 x 平移，方向不变，数值用于说明原理。</text><text x="40" y="159" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="start" font-weight="700">上一帧</text><polyline points="200,208 920,208" fill="none" stroke="#78909F" stroke-width="2" /><polygon points="920,208 910.0,204.0 910.0,212.0" fill="#78909F" /><polygon points="195.5,239.625 322,239.625 322,176.375 195.5,176.375" fill="#EAF3F7" stroke="#14678A" stroke-width="2" opacity="1" /><circle cx="230" cy="208" r="5" fill="#14678A" /><polyline points="230,208 308.2,208.0" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="308.2,208.0 298.2,204.0 298.2,212.0" fill="#14678A" /><rect x="805" y="155" width="126" height="85" rx="0" fill="#EAF3F7" stroke="#78909F" stroke-width="1.5" /><text x="868" y="139" font-family="Noto Sans CJK SC" font-size="18" fill="#183047" text-anchor="middle">同一个静止车位角点</text><circle cx="805" cy="208" r="7" fill="#AD493C" /><polyline points="230,260 805,260" fill="none" stroke="#526577" stroke-width="2" /><polygon points="805,260 795.0,256.0 795.0,264.0" fill="#526577" /><text x="517.5" y="291" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="middle">相对车辆 5 m</text><text x="40" y="336" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="start" font-weight="700">当前帧</text><polyline points="200,385 920,385" fill="none" stroke="#78909F" stroke-width="2" /><polygon points="920,385 910.0,381.0 910.0,389.0" fill="#78909F" /><polygon points="310.5,416.625 437,416.625 437,353.375 310.5,353.375" fill="#EAF3F7" stroke="#14678A" stroke-width="2" opacity="1" /><circle cx="345" cy="385" r="5" fill="#14678A" /><polyline points="345,385 423.20000000000005,385.0" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="423.20000000000005,385.0 413.20000000000005,381.0 413.20000000000005,389.0" fill="#14678A" /><rect x="805" y="332" width="126" height="85" rx="0" fill="#EAF3F7" stroke="#78909F" stroke-width="1.5" /><text x="868" y="316" font-family="Noto Sans CJK SC" font-size="18" fill="#183047" text-anchor="middle">同一个静止车位角点</text><circle cx="805" cy="385" r="7" fill="#AD493C" /><polyline points="345,437 805,437" fill="none" stroke="#526577" stroke-width="2" /><polygon points="805,437 795.0,433.0 795.0,441.0" fill="#526577" /><text x="575.0" y="468" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="middle">相对车辆 4 m</text><text x="40" y="518" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start" font-weight="700">车辆前进 1 m 后，车位角点的局部距离从 5 m 变为 4 m；参考位置仍相同。</text><rect x="40" y="569" width="245" height="78" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="162.5" y="597" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">运动补偿</text><text x="162.5" y="621" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">统一比较基准</text><polyline points="285,608 315,608" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="315,608 305.0,604.0 305.0,612.0" fill="#14678A" /><rect x="315" y="569" width="245" height="78" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="437.5" y="597" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">关联</text><text x="437.5" y="621" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">接到正确历史对象</text><polyline points="560,608 590,608" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="590,608 580.0,604.0 580.0,612.0" fill="#14678A" /><rect x="590" y="569" width="245" height="78" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="712.5" y="597" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">滤波与几何</text><text x="712.5" y="621" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">更新位置和形状</text><polyline points="835,608 865,608" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="865,608 855.0,604.0 855.0,612.0" fill="#14678A" /><rect x="865" y="569" width="245" height="78" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="987.5" y="597" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">ID / 有效状态</text><text x="987.5" y="621" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">交给规划使用</text><text x="40" y="699" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start">先确认是同一个车位，再融合观测；匹配错误不能靠滤波自动纠正。</text><text x="40" y="738" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">几何与角点画法仅作示意，未执行原模型滤波，也不代表车位永不失效。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="695" viewBox="0 0 1120 695" role="img" aria-labelledby="title desc"><title id="title">同一个点，在车体系和参考系中有不同坐标</title><desc id="desc">教学约定：参考系 x 向右、y 向上，航向逆时针为正；不替代各接口轴向定义。</desc><rect x="0" y="0" width="1120" height="695" rx="0" fill="white" stroke="none" stroke-width="1.5" /><text x="32" y="44" font-family="Noto Sans CJK SC" font-size="29" fill="#183047" text-anchor="start" font-weight="700">同一个点，在车体系和参考系中有不同坐标</text><text x="32" y="78" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">教学约定：参考系 x 向右、y 向上，航向逆时针为正；不替代各接口轴向定义。</text><polyline points="115,545 577,545" fill="none" stroke="#78909F" stroke-width="2" /><polygon points="577,545 567.0,541.0 567.0,549.0" fill="#78909F" /><polyline points="115,545 115,149" fill="none" stroke="#78909F" stroke-width="2" /><polygon points="115,149 111.0,159.0 119.0,159.0" fill="#78909F" /><text x="590" y="551" font-family="Noto Sans CJK SC" font-size="18" fill="#183047" text-anchor="start"><tspan font-style="italic">x</tspan><tspan baseline-shift="sub" font-size="70%">g</tspan>（m）</text><text x="45" y="131" font-family="Noto Sans CJK SC" font-size="18" fill="#183047" text-anchor="start"><tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="70%">g</tspan>（m）</text><polygon points="231.621,485.363 340.221,422.663 313.821,376.937 205.221,439.637" fill="#EAF3F7" stroke="#14678A" stroke-width="2" opacity="1" /><circle cx="247" cy="446.0" r="5" fill="#14678A" /><polyline points="247,446.0 315.0176352132298,406.73" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="315.0176352132298,406.73 304.35738117538546,408.2658983848623 308.35738117538546,415.19410161513775" fill="#14678A" /><polyline points="247,446.0 458.48340360415995,323.90000000000003" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="458.48340360415995,323.90000000000003 447.8231495663156,325.4358983848623 451.8231495663156,332.36410161513777" fill="#14678A" /><polyline points="247,446.0 167.8,308.82157604054487" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="167.8,308.82157604054487 169.33589838486225,319.48183007838924 176.26410161513778,315.48183007838924" fill="#14678A" /><text x="530" y="331" font-family="Noto Sans CJK SC" font-size="19" fill="#183047" text-anchor="start"><tspan font-style="italic">x</tspan><tspan baseline-shift="sub" font-size="70%">b</tspan></text><text x="146" y="302" font-family="Noto Sans CJK SC" font-size="19" fill="#183047" text-anchor="start"><tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="70%">b</tspan></text><circle cx="385.47302994931886" cy="289.84232335022705" r="7" fill="#AD493C" /><text x="398.47302994931886" y="279.84232335022705" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="start">固定环境点 P</text><polyline points="247,446 418.473,347 385.473,289.842" fill="none" stroke="#78909F" stroke-width="2" stroke-dasharray="6 5" /><polyline points="115,545 247,446" fill="none" stroke="#526577" stroke-width="2" stroke-dasharray="6 5" /><text x="130" y="589" font-family="Noto Sans CJK SC" font-size="18" fill="#183047" text-anchor="start"><tspan font-style="italic">O</tspan><tspan baseline-shift="sub" font-size="70%">g</tspan></text><text x="219" y="494.0" font-family="Noto Sans CJK SC" font-size="18" fill="#183047" text-anchor="start"><tspan font-style="italic">O</tspan><tspan baseline-shift="sub" font-size="70%">b</tspan>：车辆参考点</text><text x="700" y="174" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="start" font-weight="700">车体系：相对车辆的位置</text><text x="700" y="222" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="start">参考系：旋转后，再加车辆位置</text><text x="700" y="280" font-family="Noto Sans CJK SC" font-size="22" fill="#14678A" text-anchor="start"><tspan font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="70%">g</tspan> = <tspan font-style="italic">t</tspan><tspan baseline-shift="sub" font-size="70%">e</tspan> + R(<tspan font-style="italic">ψ</tspan><tspan baseline-shift="sub" font-size="70%">e</tspan>) <tspan font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="70%">b</tspan></text><text x="700" y="347" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="start">反向转换：先减位置，再反旋转</text><text x="700" y="393" font-family="Noto Sans CJK SC" font-size="21" fill="#14678A" text-anchor="start"><tspan font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="70%">b</tspan> = Rᵀ(<tspan font-style="italic">ψ</tspan><tspan baseline-shift="sub" font-size="70%">e</tspan>) (<tspan font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="70%">g</tspan> − <tspan font-style="italic">t</tspan><tspan baseline-shift="sub" font-size="70%">e</tspan>)</text><text x="700" y="470" font-family="Noto Sans CJK SC" font-size="19" fill="#183047" text-anchor="start">P 没有变，只是描述它的基准变了。</text><text x="32" y="651" font-family="Noto Sans CJK SC" font-size="19" fill="#183047" text-anchor="start">参考点定义必须一致；本图用旋转和平移解释原理，车体简图不按原车型尺寸缩放。</text></svg>
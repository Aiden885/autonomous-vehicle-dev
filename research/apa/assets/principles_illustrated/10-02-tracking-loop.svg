<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="705" viewBox="0 0 1120 705" role="img" aria-labelledby="title desc"><title id="title">跟踪闭环：请求不等于车辆已经做到</title><desc id="desc">原模型职责示意，省略部分信号与接收方；不是后续 C/CARLA 版本的踏板执行器框图。</desc><rect x="0" y="0" width="1120" height="705" rx="0" fill="white" stroke="none" stroke-width="1.5" /><text x="32" y="44" font-family="Noto Sans CJK SC" font-size="29" fill="#183047" text-anchor="start" font-weight="700">跟踪闭环：请求不等于车辆已经做到</text><text x="32" y="78" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">原模型职责示意，省略部分信号与接收方；不是后续 C/CARLA 版本的踏板执行器框图。</text><rect x="40" y="150" width="250" height="78" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="165.0" y="178" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">当前执行路径</text><text x="165.0" y="202" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">Planning_Out</text><rect x="435" y="150" width="250" height="78" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="560.0" y="178" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">分段执行与跟踪</text><text x="560.0" y="202" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">Moco3</text><rect x="820" y="150" width="250" height="78" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="945.0" y="178" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">底盘协调与适配</text><text x="945.0" y="202" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">ChassisCtrl1</text><polyline points="290,189 435,189" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="435,189 425.0,185.0 425.0,193.0" fill="#14678A" /><polyline points="685,189 820,189" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="820,189 810.0,185.0 810.0,193.0" fill="#14678A" /><text x="750" y="132" font-family="Noto Sans CJK SC" font-size="19" fill="#183047" text-anchor="middle">控制请求</text><rect x="820" y="440" width="250" height="78" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="945.0" y="468" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">车辆实际运动</text><text x="945.0" y="492" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">位姿 / 速度 / 挡位等</text><rect x="435" y="440" width="250" height="78" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="560.0" y="468" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">状态整理与反馈</text><text x="560.0" y="492" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">定位及车辆信号</text><rect x="40" y="440" width="250" height="78" rx="9" fill="#FAF0DE" stroke="#78909F" stroke-width="1.5" /><text x="165.0" y="468" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">任务与安全条件</text><text x="165.0" y="492" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">主状态 / MEB</text><polyline points="945,228 945,440" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="945,440 949.0,430.0 941.0,430.0" fill="#14678A" /><text x="975" y="329" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="start">实际执行</text><polyline points="820,479 685,479" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="685,479 695.0,483.0 695.0,475.0" fill="#14678A" /><text x="750" y="430" font-family="Noto Sans CJK SC" font-size="19" fill="#183047" text-anchor="middle">实际反馈</text><polyline points="560,440 560,228" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="560,228 556.0,238.0 564.0,238.0" fill="#14678A" /><text x="590" y="330" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="start">误差与进度重新计算</text><polyline points="290,479 365,479 365,189 435,189" fill="none" stroke="#14678A" stroke-width="2" stroke-dasharray="6 4" /><polygon points="435,189 425.0,185.0 425.0,193.0" fill="#14678A" /><text x="40" y="333" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start" font-weight="700">阶段 / 保护约束</text><text x="32" y="598" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start">每次用实际反馈修正请求，并根据准备、换向、路径更新和风险决定能否继续。</text><text x="32" y="654" font-family="Noto Sans CJK SC" font-size="20" fill="#526577" text-anchor="start">图6-4说明任务内运动阶段的配合；本图说明这些阶段中的反馈如何闭合。</text></svg>
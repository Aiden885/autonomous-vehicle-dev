<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="826" viewBox="0 0 1120 826" role="img" aria-labelledby="title desc"><title id="title">路径管理：不是新路一来，就立即替换正在走的路</title><desc id="desc">按原模型职责归纳的选择过程；不覆盖每种泊车分支，也不是固定统一评分公式。</desc><rect x="0" y="0" width="1120" height="826" rx="0" fill="white" stroke="none" stroke-width="1.5" /><text x="32" y="44" font-family="Noto Sans CJK SC" font-size="29" fill="#183047" text-anchor="start" font-weight="700">路径管理：不是新路一来，就立即替换正在走的路</text><text x="32" y="78" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">按原模型职责归纳的选择过程；不覆盖每种泊车分支，也不是固定统一评分公式。</text><rect x="40" y="130" width="260" height="76" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="170.0" y="158" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">几何候选</text><text x="170.0" y="182" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">geo_path_list</text><rect x="430" y="130" width="260" height="76" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="560.0" y="158" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">搜索候选</text><text x="560.0" y="182" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">search_path_list</text><rect x="820" y="130" width="260" height="76" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="950.0" y="158" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">历史路径</text><text x="950.0" y="182" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">mem_path_list</text><polyline points="170,206 170,255 560,255 560,290" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="560,290 564.0,280.0 556.0,280.0" fill="#14678A" /><polyline points="560,206 560,255 560,255 560,290" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="560,290 564.0,280.0 556.0,280.0" fill="#14678A" /><polyline points="950,206 950,255 560,255 560,290" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="560,290 564.0,280.0 556.0,280.0" fill="#14678A" /><rect x="160" y="290" width="800" height="78" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="560.0" y="318" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">确认身份、更新、有效性与相关空间条件</text><text x="560.0" y="342" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">属于当前目标，结果可采用</text><polyline points="560,368 560,418" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="560,418 564.0,408.0 556.0,408.0" fill="#14678A" /><rect x="160" y="418" width="800" height="78" rx="9" fill="white" stroke="#78909F" stroke-width="1.5" /><text x="560.0" y="446" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">结合方向、段数、场景及当前执行进度比较</text><text x="560.0" y="470" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">新结果与历史协调：保留，或在条件允许时更新</text><polyline points="560,496 560,548" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="560,548 564.0,538.0 556.0,538.0" fill="#14678A" /><rect x="160" y="548" width="800" height="78" rx="9" fill="#FAF0DE" stroke="#78909F" stroke-width="1.5" /><text x="560.0" y="576" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">当前执行路径 + 状态 + 更新编号</text><text x="560.0" y="600" font-family="Noto Sans CJK SC" font-size="16" fill="#526577" text-anchor="middle">一起交给 MoCo，不只替换 x / y 数组</text><text x="32" y="695" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start">历史路径连接着当前段、参考点和停车点；更新必须让执行方知道版本已经改变。</text><text x="32" y="745" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start" font-weight="700">历史失效或不安全时不能为保持连续而强行保留；必要时要停车或重规划。</text><text x="32" y="796" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">图2-1中的 Planner_Core 在此展开；没有把候选选择写成所有场景统一的最短路规则。</text></svg>
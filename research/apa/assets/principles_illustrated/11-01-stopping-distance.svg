<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="765" viewBox="0 0 1120 765" role="img" aria-labelledby="title desc"><title id="title">停车空间：延迟、减速和余量分别占一段距离</title><desc id="desc">采用原函数某分支的参数作算术示例；不是实测刹停距离，也不是全部 MEB 触发条件。</desc><rect x="0" y="0" width="1120" height="765" rx="0" fill="white" stroke="none" stroke-width="1.5" /><text x="32" y="44" font-family="Noto Sans CJK SC" font-size="29" fill="#183047" text-anchor="start" font-weight="700">停车空间：延迟、减速和余量分别占一段距离</text><text x="32" y="78" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">采用原函数某分支的参数作算术示例；不是实测刹停距离，也不是全部 MEB 触发条件。</text><text x="40" y="151" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="start" font-weight="700">示例输入 3.6 km/h = 1 m/s，减速度假设 4 m/s²，延迟假设 0.4 s</text><rect x="105" y="226" width="440.0" height="84" rx="0" fill="#EAF3F7" stroke="#78909F" stroke-width="1.5" /><text x="325.0" y="277" font-family="Noto Sans CJK SC" font-size="26" fill="#183047" text-anchor="middle" font-weight="700">1</text><rect x="545.0" y="226" width="137.5" height="84" rx="0" fill="#FAF0DE" stroke="#78909F" stroke-width="1.5" /><text x="613.75" y="277" font-family="Noto Sans CJK SC" font-size="26" fill="#183047" text-anchor="middle" font-weight="700">2</text><rect x="682.5" y="226" width="220.0" height="84" rx="0" fill="#F0F2F4" stroke="#78909F" stroke-width="1.5" /><text x="792.5" y="277" font-family="Noto Sans CJK SC" font-size="26" fill="#183047" text-anchor="middle" font-weight="700">3</text><polyline points="105,341 902.5,341" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="902.5,341 892.5,337.0 892.5,345.0" fill="#14678A" /><text x="503.75" y="386" font-family="Noto Sans CJK SC" font-size="25" fill="#183047" text-anchor="middle" font-weight="700">示例比较范围：0.725 m</text><text x="50" y="461" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="start" font-weight="700">1  延迟期间继续运动</text><text x="480" y="461" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="start">vτ = 1 × 0.4 = 0.400 m</text><text x="50" y="525" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="start" font-weight="700">2  实际减速所需距离</text><text x="480" y="525" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="start">v² / (2<tspan font-style="italic">a</tspan><tspan baseline-shift="sub" font-size="70%">b</tspan>) = 1² / 8 = 0.125 m</text><text x="50" y="589" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="start" font-weight="700">3  该分支附加的余量</text><text x="480" y="589" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="start">0.200 m</text><text x="32" y="686" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start">速度归零的请求不能使车辆瞬间停下；真实响应更慢时，所需空间还会增加。</text><text x="32" y="735" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">条带从抽象距离参考点起算，不自行规定接口的测距原点；保护链可结合图10-2理解。</text></svg>
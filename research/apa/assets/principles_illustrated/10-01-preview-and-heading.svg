17.77 265.741,517.522 265.71,517.274 265.678,517.027 265.645,516.779 265.611,516.531 265.576,516.284 265.54,516.037 265.503,515.79 265.465,515.543 265.426,515.296 265.386,515.049 265.344,514.803 265.302,514.556 265.259,514.31 265.215,514.064 265.17,513.819 265.124,513.573 265.077,513.328 265.028,513.082 264.979,512.837 264.929,512.593 264.878,512.348 264.826,512.104 264.773,511.86 264.718,511.616 264.663,511.372 264.607,511.128 264.55,510.885 264.492,510.642 264.433,510.399 264.373,510.157" fill="none" stroke="#526577" stroke-width="2" /><text x="280" y="482" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start">α</text><polyline points="205,582.6 493,582.6" fill="none" stroke="#526577" stroke-width="2" /><polygon points="493,582.6 483.0,578.6 483.0,586.6" fill="#526577" /><text x="351" y="620" font-family="Noto Sans CJK SC" font-size="19" fill="#183047" text-anchor="middle"><tspan font-style="italic">x</tspan><tspan baseline-shift="sub" font-size="70%">p</tspan>：前后位置</text><text x="517" y="495" font-family="Noto Sans CJK SC" font-size="21" fill="#AD493C" text-anchor="start"><tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="70%">p</tspan></text><text x="710" y="170" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start" font-weight="700">蓝弧：追向预瞄点的理想圆弧</text><text x="710" y="229" font-family="Noto Sans CJK SC" font-size="22" fill="#14678A" text-anchor="start"><tspan font-style="italic">κ</tspan><tspan baseline-shift="sub" font-size="70%">p</tspan> = 2 <tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="70%">p</tspan> / (<tspan font-style="italic">x</tspan><tspan baseline-shift="sub" font-size="70%">p</tspan>² + <tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="70%">p</tspan>²)</text><text x="710" y="299" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start">α 是看向 P 的视线夹角。</text><text x="710" y="365" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start"><tspan font-style="italic">e</tspan><tspan baseline-shift="sub" font-size="70%">ψ</tspan> 是参考航向与车头的差。</text><text x="710" y="421" font-family="Noto Sans CJK SC" font-size="22" fill="#AD493C" text-anchor="start"><tspan font-style="italic">e</tspan><tspan baseline-shift="sub" font-size="70%">ψ</tspan> = wrap(<tspan font-style="italic">ψ</tspan><tspan baseline-shift="sub" font-size="70%">r</tspan> − <tspan font-style="italic">ψ</tspan><tspan baseline-shift="sub" font-size="70%">e</tspan>)</text><text x="710" y="489" font-family="Noto Sans CJK SC" font-size="23" fill="#183047" text-anchor="start" font-weight="700">α 与 <tspan font-style="italic">e</tspan><tspan baseline-shift="sub" font-size="70%">ψ</tspan> 不能混用。</text><text x="710" y="552" font-family="Noto Sans CJK SC" font-size="19" fill="#183047" text-anchor="start"><tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="70%">p</tspan> 也不必等于最近点横向误差。</text><text x="32" y="676" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="start">原分支还处理方向、增益、死区和转向尺度；倒车不能只照搬这个前进示意。</text><text x="32" y="718" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">本图说明跟踪几何；图10-2再把它放回执行请求、底盘和实际反馈的闭环。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc"><title id="title">预瞄位置与航向偏差，是两种不同的信息</title><desc id="desc">前进几何教学例：车头沿车体纵向正向；预瞄项是反馈，不直接等同于曲率前馈。</desc><rect x="0" y="0" width="1120" height="740" rx="0" fill="white" stroke="none" stroke-width="1.5" /><text x="32" y="44" font-family="Noto Sans CJK SC" font-size="29" fill="#183047" text-anchor="start" font-weight="700">预瞄位置与航向偏差，是两种不同的信息</text><text x="32" y="78" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">前进几何教学例：车头沿车体纵向正向；预瞄项是反馈，不直接等同于曲率前馈。</text><polyline points="161.8,525 601.0,525" fill="none" stroke="#78909F" stroke-width="2" /><polygon points="601.0,525 591.0,521.0 591.0,529.0" fill="#78909F" /><polyline points="205,553.8 205,193.8" fill="none" stroke="#78909F" stroke-width="2" /><polygon points="205,193.8 201.0,203.8 209.0,203.8" fill="#78909F" /><text x="605" y="547" font-family="Noto Sans CJK SC" font-size="18" fill="#183047" text-anchor="start"><tspan font-style="italic">x</tspan><tspan baseline-shift="sub" font-size="70%">b</tspan>（m）</text><text x="122" y="178" font-family="Noto Sans CJK SC" font-size="18" fill="#183047" text-anchor="start"><tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="70%">b</tspan>（m）</text><polygon points="169,553.8 305.8,553.8 305.8,496.2 169,496.2" fill="#EAF3F7" stroke="#14678A" stroke-width="2" opacity="1" /><circle cx="205" cy="525" r="5" fill="#14678A" /><polyline points="205,525 290.68,525.0" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="290.68,525.0 280.68,521.0 280.68,529.0" fill="#14678A" /><polyline points="205,525 493,453" fill="none" stroke="#526577" stroke-width="2" stroke-dasharray="6 5" /><polyline points="205,525 209.998,524.98 214.995,524.918 219.991,524.816 224.987,524.674 229.981,524.49 234.973,524.266 239.964,524 244.952,523.695 249.938,523.348 254.92,522.961 259.899,522.533 264.875,522.064 269.846,521.
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc"><title id="title">圆弧连接：起点朝向与目标方向共同限制形状</title><desc id="desc">单圆几何教学示意，不是当前场景的规划输出；参考点采用后轴类定义。</desc><rect x="0" y="0" width="1120" height="740" rx="0" fill="white" stroke="none" stroke-width="1.5" /><text x="32" y="44" font-family="Noto Sans CJK SC" font-size="29" fill="#183047" text-anchor="start" font-weight="700">圆弧连接：起点朝向与目标方向共同限制形状</text><text x="32" y="78" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">单圆几何教学示意，不是当前场景的规划输出；参考点采用后轴类定义。</text><polyline points="205,550 213.043,549.875 221.078,549.499 229.098,548.872 237.094,547.996 245.059,546.871 252.985,545.498 260.865,543.879 268.69,542.015 276.453,539.908 284.147,537.56 291.764,534.973 299.296,532.15 306.737,529.094 314.079,525.807 321.315,522.293 328.438,518.555 335.441,514.597 342.317,510.422 349.059,506.035 355.662,501.44 362.118,496.641 368.421,491.644 374.566,486.452 380.545,481.071 386.354,475.507 391.987,469.764 397.438,463.848 402.701,457.765 407.773,451.521 412.648,445.122 417.32,438.575 421.786,431.884 426.042,425.058 430.083,418.102 433.904,411.024 437.504,403.83 440.877,396.528 444.021,389.123 446.933,381.625 449.609,374.039 452.048,366.373 454.246,358.636 456.202,350.833 457.914,342.973 459.381,335.064 460.599,327.113 461.57,319.127 462.291,311.116 462.762,303.085 462.982,295.044 462.952,287 462.67,278.961 462.139,270.934 461.357,262.928 460.326,254.951 459.047,247.009 457.521,239.111 455.749,231.264 453.734,223.477 451.477,215.756" fill="none" stroke="#78909F" stroke-width="2" stroke-dasharray="6 5" /><polyline points="463,593 463,120" fill="none" stroke="#526577" stroke-width="2" /><polyline points="205,292 205,550" fill="none" stroke="#78909F" stroke-width="2" stroke-dasharray="6 5" /><polyline points="205,292 463,292" fill="none" stroke="#78909F" stroke-width="2" stroke-dasharray="6 5" /><polyline points="205,550 211.754,549.912 218.503,549.646 225.242,549.205 231.968,548.587 238.676,547.793 245.36,546.824 252.017,545.68 258.641,544.362 265.229,542.871 271.775,541.209 278.276,539.375 284.726,537.373 291.122,535.202 297.459,532.864 303.732,530.361 309.938,527.695 316.072,524.867 322.13,521.88 328.107,518.735 334,515.435 339.805,511.981 345.517,508.377 351.133,504.625 356.649,500.726 362.06,496.685 367.365,492.504 372.558,488.185 377.636,483.731 382.595,479.147 387.434,474.434 392.147,469.595 396.731,464.636 401.185,459.558 405.504,454.365 409.685,449.06 413.726,443.649 417.625,438.133 421.377,432.517 424.981,426.805 428.435,421 431.735,415.107 434.88,409.13 437.867,403.072 440.695,396.938 443.361,390.732 445.864,384.459 448.202,378.122 450.373,371.726 452.375,365.276 454.209,358.775 455.871,352.229 457.362,345.641 458.68,339.017 459.824,332.36 460.793,325.676 461.587,318.968 462.205,312.242 462.646,305.503 462.912,298.754 463,292" fill="none" stroke="#14678A" stroke-width="5" /><polygon points="183.5,567.2 265.2,567.2 265.2,532.8 183.5,532.8" fill="#EAF3F7" stroke="#14678A" stroke-width="2" opacity="1" /><circle cx="205" cy="550" r="5" fill="#14678A" /><polyline points="205,550 256.17,550.0" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="256.17,550.0 246.17000000000002,546.0 246.17000000000002,554.0" fill="#14678A" /><polygon points="480.2,313.5 480.2,231.8 445.8,231.8 445.8,313.5" fill="#EAF3F7" stroke="#14678A" stroke-width="2" opacity="1" /><circle cx="463" cy="292" r="5" fill="#14678A" /><polyline points="463,292 463.0,240.83000000000004" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="463.0,240.83000000000004 459.0,250.83000000000004 467.0,250.83000000000004" fill="#14678A" /><circle cx="205" cy="292" r="6" fill="#AD493C" /><text x="85" y="285" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="start">圆心 C</text><text x="230" y="416" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="start">半径 R</text><text x="83" y="608" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="start">起点：切线沿车头方向</text><text x="465" y="126" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="start">目标直线</text><text x="640" y="176" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="start" font-weight="700">① 起点切线与当前朝向相容</text><text x="640" y="233" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="start">圆心位于起点方向的一侧法线上。</text><text x="640" y="313" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="start" font-weight="700">② 圆弧与目标直线相切</text><text x="640" y="370" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="start">圆心到目标线的距离等于半径。</text><text x="640" y="452" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="start" font-weight="700">③ 再检查半径和可用空间</text><text x="640" y="507" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="start">几何接得上，不等于整车能通过。</text><text x="32" y="675" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start">κ = tan(δ) / L，转角有限意味着半径不能任意小；直线与圆弧只是候选构造。</text><text x="32" y="717" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">本图下一步由图7-2补充车身扫掠；不承诺单圆可解决所有起始姿态或车位。</text></svg>
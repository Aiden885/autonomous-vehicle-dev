<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="738" viewBox="0 0 1120 738" role="img" aria-labelledby="title desc"><title id="title">多周期闭环：控制更新时，规划未必刚好产生新路</title><desc id="desc">按 5 ms 基础调用假设说明名义频率；图中相位为教学排列，不是实测调度记录。</desc><rect x="0" y="0" width="1120" height="738" rx="0" fill="white" stroke="none" stroke-width="1.5" /><text x="32" y="44" font-family="Noto Sans CJK SC" font-size="29" fill="#183047" text-anchor="start" font-weight="700">多周期闭环：控制更新时，规划未必刚好产生新路</text><text x="32" y="78" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">按 5 ms 基础调用假设说明名义频率；图中相位为教学排列，不是实测调度记录。</text><polyline points="245,160 245,475" fill="none" stroke="#D8E0E5" stroke-width="2" /><text x="245" y="136" font-family="Noto Sans CJK SC" font-size="18" fill="#183047" text-anchor="middle">0</text><polyline points="281,160 281,475" fill="none" stroke="#D8E0E5" stroke-width="2" /><polyline points="317,160 317,475" fill="none" stroke="#D8E0E5" stroke-width="2" /><polyline points="353,160 353,475" fill="none" stroke="#D8E0E5" stroke-width="2" /><polyline points="389,160 389,475" fill="none" stroke="#D8E0E5" stroke-width="2" /><text x="389" y="136" font-family="Noto Sans CJK SC" font-size="18" fill="#183047" text-anchor="middle">20</text><polyline points="425,160 425,475" fill="none" stroke="#D8E0E5" stroke-width="2" /><polyline points="461,160 461,475" fill="none" stroke="#D8E0E5" stroke-width="2" /><polyline points="497,160 497,475" fill="none" stroke="#D8E0E5" stroke-width="2" /><polyline points="533,160 533,475" fill="none" stroke="#D8E0E5" stroke-width="2" /><text x="533" y="136" font-family="Noto Sans CJK SC" font-size="18" fill="#183047" text-anchor="middle">40</text><polyline points="569,160 569,475" fill="none" stroke="#D8E0E5" stroke-width="2" /><polyline points="605,160 605,475" fill="none" stroke="#D8E0E5" stroke-width="2" /><polyline points="641,160 641,475" fill="none" stroke="#D8E0E5" stroke-width="2" /><polyline points="677,160 677,475" fill="none" stroke="#D8E0E5" stroke-width="2" /><text x="677" y="136" font-family="Noto Sans CJK SC" font-size="18" fill="#183047" text-anchor="middle">60</text><polyline points="713,160 713,475" fill="none" stroke="#D8E0E5" stroke-width="2" /><polyline points="749,160 749,475" fill="none" stroke="#D8E0E5" stroke-width="2" /><polyline points="785,160 785,475" fill="none" stroke="#D8E0E5" stroke-width="2" /><polyline points="821,160 821,475" fill="none" stroke="#D8E0E5" stroke-width="2" /><text x="821" y="136" font-family="Noto Sans CJK SC" font-size="18" fill="#183047" text-anchor="middle">80</text><polyline points="857,160 857,475" fill="none" stroke="#D8E0E5" stroke-width="2" /><polyline points="893,160 893,475" fill="none" stroke="#D8E0E5" stroke-width="2" /><polyline points="929,160 929,475" fill="none" stroke="#D8E0E5" stroke-width="2" /><polyline points="965,160 965,475" fill="none" stroke="#D8E0E5" stroke-width="2" /><text x="965" y="136" font-family="Noto Sans CJK SC" font-size="18" fill="#183047" text-anchor="middle">100</text><text x="1010" y="137" font-family="Noto Sans CJK SC" font-size="18" fill="#183047" text-anchor="start">ms</text><text x="28" y="218" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="start" font-weight="700">基础调用</text><rect x="274" y="198" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="310" y="198" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="346" y="198" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="382" y="198" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="418" y="198" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="454" y="198" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="490" y="198" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="526" y="198" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="562" y="198" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="598" y="198" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="634" y="198" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="670" y="198" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="706" y="198" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="742" y="198" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="778" y="198" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="814" y="198" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="850" y="198" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="886" y="198" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="922" y="198" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="958" y="198" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><polyline points="245,210 965,210" fill="none" stroke="#78909F" stroke-width="2" /><text x="28" y="328" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="start" font-weight="700">约 20 ms 组</text><rect x="382" y="308" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="526" y="308" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="670" y="308" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="814" y="308" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="958" y="308" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><polyline points="245,320 965,320" fill="none" stroke="#78909F" stroke-width="2" /><text x="28" y="438" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="start" font-weight="700">约 50 ms 组</text><rect x="598" y="418" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><rect x="958" y="418" width="14" height="24" rx="0" fill="#14678A" stroke="#14678A" stroke-width="1.5" /><polyline points="245,430 965,430" fill="none" stroke="#78909F" stroke-width="2" /><text x="40" y="521" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start">搜索计数组：在同一基础调用假设下约 800 ms，本图不展开该时间尺度。</text><rect x="40" y="556" width="1040" height="94" rx="9" fill="#EAF3F7" stroke="#78909F" stroke-width="1.5" /><text x="60" y="592" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start" font-weight="700">控制在两次路径更新之间，仍可使用最近一次有效路径与跨周期执行进度。</text><text x="60" y="626" font-family="Noto Sans CJK SC" font-size="19" fill="#183047" text-anchor="start">新路径到来时，再按版本和任务条件接续；不是所有任务都等下一次搜索才能运行。</text><text x="32" y="703" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">频率来自原调度计数条件的推算；初始相位、实际触发、顺序和停用支路仍按模型确认。</text></svg>
<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc"><title id="title">分离轴：一个方向能分开，就足以说明不相交</title><desc id="desc">凸多边形教学示意；图中矩形轴向简单，实际车辆旋转后需相应的边法向。</desc><rect x="0" y="0" width="1120" height="680" rx="0" fill="white" stroke="none" stroke-width="1.5" /><text x="32" y="44" font-family="Noto Sans CJK SC" font-size="29" fill="#183047" text-anchor="start" font-weight="700">分离轴：一个方向能分开，就足以说明不相交</text><text x="32" y="78" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">凸多边形教学示意；图中矩形轴向简单，实际车辆旋转后需相应的边法向。</text><text x="285" y="135" font-family="Noto Sans CJK SC" font-size="23" fill="#183047" text-anchor="middle" font-weight="700">例 A：x 方向已经分开</text><text x="840" y="135" font-family="Noto Sans CJK SC" font-size="23" fill="#183047" text-anchor="middle" font-weight="700">例 B：x 重叠，仍不能判相交</text><rect x="70" y="230" width="130" height="80" rx="0" fill="#EAF3F7" stroke="#14678A" stroke-width="1.5" /><text x="135.0" y="277.0" font-family="Noto Sans CJK SC" font-size="23" fill="#183047" text-anchor="middle">A</text><rect x="660" y="210" width="130" height="80" rx="0" fill="#EAF3F7" stroke="#14678A" stroke-width="1.5" /><text x="725.0" y="257.0" font-family="Noto Sans CJK SC" font-size="23" fill="#183047" text-anchor="middle">A</text><rect x="350" y="230" width="130" height="80" rx="0" fill="#FAF0DE" stroke="#A8792E" stroke-width="1.5" /><text x="415.0" y="277.0" font-family="Noto Sans CJK SC" font-size="23" fill="#183047" text-anchor="middle">B</text><rect x="720" y="350" width="130" height="80" rx="0" fill="#FAF0DE" stroke="#A8792E" stroke-width="1.5" /><text x="785.0" y="397.0" font-family="Noto Sans CJK SC" font-size="23" fill="#183047" text-anchor="middle">B</text><polyline points="70,310 70,470" fill="none" stroke="#78909F" stroke-width="2" stroke-dasharray="6 5" /><polyline points="200,310 200,470" fill="none" stroke="#78909F" stroke-width="2" stroke-dasharray="6 5" /><polyline points="350,310 350,470" fill="none" stroke="#78909F" stroke-width="2" stroke-dasharray="6 5" /><polyline points="480,310 480,470" fill="none" stroke="#78909F" stroke-width="2" stroke-dasharray="6 5" /><polyline points="660,290 660,470" fill="none" stroke="#78909F" stroke-width="2" stroke-dasharray="6 5" /><polyline points="790,290 790,470" fill="none" stroke="#78909F" stroke-width="2" stroke-dasharray="6 5" /><polyline points="720,430 720,470" fill="none" stroke="#78909F" stroke-width="2" stroke-dasharray="6 5" /><polyline points="850,430 850,470" fill="none" stroke="#78909F" stroke-width="2" stroke-dasharray="6 5" /><polyline points="40,470 525,470" fill="none" stroke="#78909F" stroke-width="2" /><polygon points="525,470 515.0,466.0 515.0,474.0" fill="#78909F" /><polyline points="610,470 1070,470" fill="none" stroke="#78909F" stroke-width="2" /><polygon points="1070,470 1060.0,466.0 1060.0,474.0" fill="#78909F" /><polyline points="70,492 200,492" fill="none" stroke="#14678A" stroke-width="7" /><polyline points="660,492 790,492" fill="none" stroke="#14678A" stroke-width="7" /><polyline points="350,519 480,519" fill="none" stroke="#A8792E" stroke-width="7" /><polyline points="720,519 850,519" fill="none" stroke="#A8792E" stroke-width="7" /><polyline points="620,323 1040,323" fill="none" stroke="#AD493C" stroke-width="2" stroke-dasharray="6 5" /><text x="890" y="307" font-family="Noto Sans CJK SC" font-size="19" fill="#AD493C" text-anchor="start">沿 y 可以分开</text><text x="285" y="559" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="middle">投影区间不重叠 → 已找到分离轴</text><text x="840" y="559" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="middle">x 投影重叠 → 继续检查其他候选轴</text><text x="32" y="625" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start">不能把某一个轴重叠直接当作碰撞；接触、容差和运动区间另按实际实现处理。</text></svg>
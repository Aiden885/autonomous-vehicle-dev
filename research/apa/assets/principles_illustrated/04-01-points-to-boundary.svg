<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="686" viewBox="0 0 1120 686" role="img" aria-labelledby="title desc"><title id="title">从点到边界：分组与拟合解决不同问题</title><desc id="desc">相同一组教学点依次展示；不是真实传感器记录，也不表示识别了全部物体。</desc><rect x="0" y="0" width="1120" height="686" rx="0" fill="white" stroke="none" stroke-width="1.5" /><text x="32" y="44" font-family="Noto Sans CJK SC" font-size="29" fill="#183047" text-anchor="start" font-weight="700">从点到边界：分组与拟合解决不同问题</text><text x="32" y="78" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">相同一组教学点依次展示；不是真实传感器记录，也不表示识别了全部物体。</text><text x="190" y="137" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">① 输入零散点</text><rect x="40" y="162" width="300" height="300" rx="0" fill="white" stroke="#D5DEE5" stroke-width="1.5" /><circle cx="65" cy="255" r="4" fill="#526577" /><circle cx="88" cy="262" r="4" fill="#526577" /><circle cx="111" cy="269" r="4" fill="#526577" /><circle cx="134" cy="255" r="4" fill="#526577" /><circle cx="157" cy="262" r="4" fill="#526577" /><circle cx="180" cy="269" r="4" fill="#526577" /><circle cx="203" cy="255" r="4" fill="#526577" /><circle cx="226" cy="262" r="4" fill="#526577" /><circle cx="249" cy="269" r="4" fill="#526577" /><circle cx="272" cy="255" r="4" fill="#526577" /><circle cx="200" cy="352" r="4" fill="#526577" /><circle cx="220" cy="340" r="4" fill="#526577" /><circle cx="244" cy="347" r="4" fill="#526577" /><circle cx="251" cy="370" r="4" fill="#526577" /><circle cx="225" cy="384" r="4" fill="#526577" /><circle cx="204" cy="375" r="4" fill="#526577" /><circle cx="100" cy="397" r="4" fill="#526577" /><circle cx="330" cy="307" r="4" fill="#526577" /><text x="565" y="137" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">② 按邻近关系分组</text><rect x="415" y="162" width="300" height="300" rx="0" fill="white" stroke="#D5DEE5" stroke-width="1.5" /><circle cx="440" cy="255" r="4" fill="#14678A" /><circle cx="463" cy="262" r="4" fill="#14678A" /><circle cx="486" cy="269" r="4" fill="#14678A" /><circle cx="509" cy="255" r="4" fill="#14678A" /><circle cx="532" cy="262" r="4" fill="#14678A" /><circle cx="555" cy="269" r="4" fill="#14678A" /><circle cx="578" cy="255" r="4" fill="#14678A" /><circle cx="601" cy="262" r="4" fill="#14678A" /><circle cx="624" cy="269" r="4" fill="#14678A" /><circle cx="647" cy="255" r="4" fill="#14678A" /><circle cx="575" cy="352" r="4" fill="#A8792E" /><circle cx="595" cy="340" r="4" fill="#A8792E" /><circle cx="619" cy="347" r="4" fill="#A8792E" /><circle cx="626" cy="370" r="4" fill="#A8792E" /><circle cx="600" cy="384" r="4" fill="#A8792E" /><circle cx="579" cy="375" r="4" fill="#A8792E" /><circle cx="475" cy="397" r="4" fill="#526577" /><circle cx="705" cy="307" r="4" fill="#526577" /><polyline points="433,244 660,244" fill="none" stroke="#14678A" stroke-width="2" stroke-dasharray="6 5" /><text x="431" y="194" font-family="Noto Sans CJK SC" font-size="18" fill="#183047" text-anchor="start">分成两组，孤立点另作处理</text><text x="940" y="137" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="middle" font-weight="700">③ 提取线段与轮廓</text><rect x="790" y="162" width="300" height="300" rx="0" fill="white" stroke="#D5DEE5" stroke-width="1.5" /><circle cx="815" cy="255" r="4" fill="#14678A" /><circle cx="838" cy="262" r="4" fill="#14678A" /><circle cx="861" cy="269" r="4" fill="#14678A" /><circle cx="884" cy="255" r="4" fill="#14678A" /><circle cx="907" cy="262" r="4" fill="#14678A" /><circle cx="930" cy="269" r="4" fill="#14678A" /><circle cx="953" cy="255" r="4" fill="#14678A" /><circle cx="976" cy="262" r="4" fill="#14678A" /><circle cx="999" cy="269" r="4" fill="#14678A" /><circle cx="1022" cy="255" r="4" fill="#14678A" /><circle cx="950" cy="352" r="4" fill="#A8792E" /><circle cx="970" cy="340" r="4" fill="#A8792E" /><circle cx="994" cy="347" r="4" fill="#A8792E" /><circle cx="1001" cy="370" r="4" fill="#A8792E" /><circle cx="975" cy="384" r="4" fill="#A8792E" /><circle cx="954" cy="375" r="4" fill="#A8792E" /><circle cx="850" cy="397" r="4" fill="#526577" /><circle cx="1080" cy="307" r="4" fill="#526577" /><polyline points="815,262 1022,262" fill="none" stroke="#14678A" stroke-width="4" /><polygon points="950,352 970,340 994,347 1001,370 975,384 954,375" fill="none" stroke="#A8792E" stroke-width="2" opacity="1" /><polyline points="345,310 405,310" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="405,310 395.0,306.0 395.0,314.0" fill="#14678A" /><polyline points="720,310 780,310" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="780,310 770.0,306.0 770.0,314.0" fill="#14678A" /><text x="40" y="507" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="start">聚类：把相邻点归组。拟合：用支持点估计墙的方向和范围。凸包：描述点群外缘。</text><rect x="40" y="541" width="1050" height="88" rx="9" fill="#EAF3F7" stroke="#78909F" stroke-width="1.5" /><text x="60" y="575" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="start">超声证据还要先匹配对象，再核对或修正相关几何；不是把两个来源直接求平均。</text><text x="60" y="607" font-family="Noto Sans CJK SC" font-size="19" fill="#183047" text-anchor="start">最终还需携带类别、数量、有效性与更新信息，供规划和安全链采用。</text><text x="40" y="666" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">本图只展示几何整理；神经网络识别、不可见表面和完整空间可用性不由这三步自动保证。</text></svg>
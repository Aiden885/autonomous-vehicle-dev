<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc"><title id="title">后轴轨迹不碰，车头仍可能扫到障碍</title><desc id="desc">接续图7-1的恒曲率圆弧；车身尺寸为教学设定，不是原车型标定。</desc><rect x="0" y="0" width="1120" height="740" rx="0" fill="white" stroke="none" stroke-width="1.5" /><text x="32" y="44" font-family="Noto Sans CJK SC" font-size="29" fill="#183047" text-anchor="start" font-weight="700">后轴轨迹不碰，车头仍可能扫到障碍</text><text x="32" y="78" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">接续图7-1的恒曲率圆弧；车身尺寸为教学设定，不是原车型标定。</text><polygon points="113,612.8 314.6,612.8 314.6,537.2 113,537.2" fill="#EAF3F7" stroke="#14678A" stroke-width="2" opacity="0.35" /><circle cx="155.0" cy="575.0" r="5" fill="#14678A" /><polyline points="155.0,575.0 290.65999999999997,575.0" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="290.65999999999997,575.0 280.65999999999997,571.0 280.65999999999997,579.0" fill="#14678A" /><polygon points="330.221,557.618 472.774,415.065 419.317,361.608 276.764,504.161" fill="#EAF3F7" stroke="#14678A" stroke-width="2" opacity="0.8" /><circle cx="333.19090885900994" cy="501.19090885901" r="5" fill="#14678A" /><polyline points="333.19090885900994,501.19090885901 429.117014794777,405.26480292324294" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="429.117014794777,405.26480292324294 419.2175198581653,409.5074436103622 424.87437410765773,415.1642978598546" fill="#14678A" /><polygon points="444.8,365 444.8,163.4 369.2,163.4 369.2,365" fill="#EAF3F7" stroke="#14678A" stroke-width="2" opacity="0.35" /><circle cx="407.0" cy="323.0" r="5" fill="#14678A" /><polyline points="407.0,323.0 407.0,187.34000000000003" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="407.0,187.34000000000003 403.0,197.34000000000003 411.0,197.34000000000003" fill="#14678A" /><polyline points="155,575 161.597,574.914 168.189,574.655 174.772,574.223 181.341,573.62 187.893,572.844 194.421,571.897 200.923,570.78 207.394,569.493 213.828,568.037 220.222,566.413 226.572,564.623 232.872,562.666 239.119,560.546 245.309,558.262 251.436,555.818 257.498,553.213 263.489,550.451 269.406,547.534 275.244,544.462 281,541.238 286.67,537.865 292.249,534.345 297.734,530.68 303.122,526.872 308.408,522.925 313.589,518.841 318.661,514.622 323.621,510.272 328.465,505.794 333.191,501.191 337.794,496.465 342.272,491.621 346.622,486.661 350.841,481.589 354.925,476.408 358.872,471.122 362.68,465.734 366.345,460.249 369.865,454.67 373.238,449 376.462,443.244 379.534,437.406 382.451,431.489 385.213,425.498 387.818,419.436 390.262,413.309 392.546,407.119 394.666,400.872 396.623,394.572 398.413,388.222 400.037,381.828 401.493,375.394 402.78,368.923 403.897,362.421 404.844,355.893 405.62,349.341 406.223,342.772 406.655,336.189 406.914,329.597 407,323" fill="none" stroke="#14678A" stroke-width="4" /><circle cx="431.19590873146547" cy="438.82409075835653" r="9" fill="#AD493C" /><polyline points="665,338 446.19590873146547,438.82409075835653" fill="none" stroke="#AD493C" stroke-width="2" /><polygon points="446.19590873146547,438.82409075835653 456.9520752773008,438.2719302398003 453.604056562204,431.0062044891707" fill="#AD493C" /><text x="685" y="335" font-family="Noto Sans CJK SC" font-size="22" fill="#AD493C" text-anchor="start" font-weight="700">这个障碍侵入示例车身</text><text x="685" y="383" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="start">但没有落在蓝色后轴轨迹上。</text><text x="685" y="460" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="start">车辆外形随位置和朝向一起变化。</text><text x="685" y="507" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="start">车头、车尾走出的区域不同。</text><text x="70" y="633" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="start">蓝线：后轴参考轨迹；浅色框：沿路三个姿态的车身外廓。</text><text x="32" y="689" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start" font-weight="700">实际检查还需覆盖姿态之间的运动，不能只检查图中三个采样姿态。</text><text x="32" y="724" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">此图只证明这个教学几何例子的区别，不是原场景碰撞回放或完整扫掠验算。</text></svg>
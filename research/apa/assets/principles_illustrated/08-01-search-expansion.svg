ont-family="Noto Sans CJK SC" font-size="19" fill="#183047" text-anchor="start">完整车辆检查接着看图8-2。</text><text x="32" y="662" font-family="Noto Sans CJK SC" font-size="21" fill="#183047" text-anchor="start">f = g + λh：已走代价与后续估计帮助排序；相似状态查重可减少重复尝试。</text><text x="32" y="706" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">本图只画前进动作的局部展开；原规划还涉及倒车、解析连接、预算和结果回溯。</text></svg>
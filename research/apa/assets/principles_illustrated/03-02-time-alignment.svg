<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="565" viewBox="0 0 1120 565" role="img" aria-labelledby="title desc"><title id="title">坐标相同还不够：观测必须对应正确时刻</title><desc id="desc">教学示意，无真实时间数值；说明时间配对，不宣称所有输入均已实现插值补偿。</desc><rect x="0" y="0" width="1120" height="565" rx="0" fill="white" stroke="none" stroke-width="1.5" /><text x="32" y="44" font-family="Noto Sans CJK SC" font-size="29" fill="#183047" text-anchor="start" font-weight="700">坐标相同还不够：观测必须对应正确时刻</text><text x="32" y="78" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">教学示意，无真实时间数值；说明时间配对，不宣称所有输入均已实现插值补偿。</text><text x="32" y="192" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="start" font-weight="700">车辆位姿</text><polyline points="200,185 1060,185" fill="none" stroke="#78909F" stroke-width="2" /><polygon points="1060,185 1050.0,181.0 1050.0,189.0" fill="#78909F" /><text x="32" y="322" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="start" font-weight="700">感知结果</text><polyline points="200,315 1060,315" fill="none" stroke="#78909F" stroke-width="2" /><polygon points="1060,315 1050.0,311.0 1050.0,319.0" fill="#78909F" /><polyline points="290,150 290,370" fill="none" stroke="#78909F" stroke-width="2" stroke-dasharray="6 5" /><text x="290" y="127" font-family="Noto Sans CJK SC" font-size="19" fill="#183047" text-anchor="middle">较早时刻 t_a</text><polyline points="620,150 620,370" fill="none" stroke="#78909F" stroke-width="2" stroke-dasharray="6 5" /><text x="620" y="127" font-family="Noto Sans CJK SC" font-size="19" fill="#183047" text-anchor="middle">结果到达</text><polyline points="960,150 960,370" fill="none" stroke="#78909F" stroke-width="2" stroke-dasharray="6 5" /><text x="960" y="127" font-family="Noto Sans CJK SC" font-size="19" fill="#183047" text-anchor="middle">当前时刻 t_b</text><circle cx="290" cy="185" r="8" fill="#14678A" /><circle cx="960" cy="185" r="8" fill="#14678A" /><circle cx="290" cy="315" r="8" fill="#AD493C" /><polyline points="290,315 620,315" fill="none" stroke="#526577" stroke-width="2" /><polygon points="620,315 610.0,311.0 610.0,319.0" fill="#526577" /><text x="451" y="351" font-family="Noto Sans CJK SC" font-size="19" fill="#183047" text-anchor="middle">计算 / 传输后才收到</text><polyline points="290,303 290,197" fill="none" stroke="#14678A" stroke-width="2" /><polygon points="290,197 286.0,207.0 294.0,207.0" fill="#14678A" /><text x="330" y="252" font-family="Noto Sans CJK SC" font-size="21" fill="#14678A" text-anchor="start">观测属于 t_a，应先与 t_a 的位姿配对</text><text x="32" y="431" font-family="Noto Sans CJK SC" font-size="22" fill="#183047" text-anchor="start" font-weight="700">把旧观测直接当成当前车体系数据，会把车辆这段运动混进环境位置。</text><text x="32" y="482" font-family="Noto Sans CJK SC" font-size="20" fill="#183047" text-anchor="start">正确时间标记与位姿关系，是坐标转换、历史缓存和跨帧车位跟踪共同的基础。</text><text x="32" y="530" font-family="Noto Sans CJK SC" font-size="18" fill="#526577" text-anchor="start">本图讲同步目标；原模型各支路的计数、标志和补偿方式仍按实际实现区分。</text></svg>
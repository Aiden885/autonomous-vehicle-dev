syntax = "proto3";

package pangu.modules;

import "node_module_config.proto";

message ACCModuleParams {
    string work_root = 1;
    double timer_duration = 2;
    double desired_distance_m = 3;
    double max_speed_mps = 4;
    double distance_gain = 5;
    double speed_gain = 6;
    bool enable_zmq_bridge = 7;
    int32 zmq_poll_timeout_ms = 8;
    bool zmq_control_enable = 9;
}

message AccInput {
    uint32 frame_id = 1;
    double ego_speed_mps = 2;
    double lead_speed_mps = 3;
    double lead_distance_m = 4;
    int32 command_type = 5;
}

message AccOutput {
    uint32 frame_id = 1;
    double target_speed_mps = 2;
    bool enable = 3;
    bool valid = 4;
    double time_gap_s = 5;
    double max_speed_mps = 6;
    int32 decision = 7;
    int32 system_state = 8;
}

message ACCModuleConfig {
    icvos.common.NodeModuleConfig basic = 1;
    ACCModuleParams params = 2;
}

message ZmqBridgeModuleParams {
    double timer_duration = 1;
    int32 zmq_poll_timeout_ms = 2;
    bool zmq_control_enable = 3;
}

message ZmqBridgeModuleConfig {
    icvos.common.NodeModuleConfig basic = 1;
    ZmqBridgeModuleParams params = 2;
}

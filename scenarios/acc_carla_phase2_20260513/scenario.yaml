  ego_role_name: hero
  ego_spawn_index: 198
  lead_role_name: gaasd_lead
  lead_distance_m: 25
  lead_speed_mps: 2
  lead_placement: lane_waypoint
  lead_behavior: traffic_manager
  spectator:
    back_m: 8
    up_m: 6
    pitch_deg: -25

bridge:

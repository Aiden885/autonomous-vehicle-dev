environment:
  host_os: Ubuntu
  carla_version: "0.9.15"
  carla_root: "/home/aiden/snap/code/app/carla-package"
  gaasd_runtime_container: "ubuntuenv.tar:env"
  python: "python3.8"

carla_scene:

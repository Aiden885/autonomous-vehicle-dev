    ki: 0.05
    kd: 0.08
    integral_limit: 2.0
    deadband_mps: 0.05
    max_throttle: 0.7
    max_brake: 0.35

gaasd_projects:
  carla_closed_loop:
    snapshot_path: gaasd_project_snapshot/carla
